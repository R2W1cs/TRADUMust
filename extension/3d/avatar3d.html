<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    SignBridge 3D Avatar Renderer
    Loaded as an iframe from the content script overlay.
    Communicates via postMessage: { type: 'SB_POSE', key: 'HELLO' }
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100% !important; height: 100% !important; }

    #sb-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.45);
      font: 10px/1.5 sans-serif;
      gap: 10px;
      pointer-events: none;
    }
    .sb-spinner {
      width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: rgba(130,100,255,0.8);
      border-radius: 50%;
      animation: sb-spin 0.75s linear infinite;
    }
    @keyframes sb-spin { to { transform: rotate(360deg); } }

    #sb-error {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      text-align: center;
      font: 9px/1.5 sans-serif;
      color: rgba(255,130,130,0.8);
    }
    #sb-error.visible { display: flex; }

    #sb-sign-label {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font: bold 8px/1 sans-serif;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
      z-index: 2;
    }

    #sb-mode-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font: 8px/1 sans-serif;
      color: rgba(255,255,255,0.3);
      pointer-events: none;
      z-index: 2;
    }

  </style>
</head>
<body>
  <div id="sb-loading">
    <div class="sb-spinner"></div>
    <span>Loading 3D avatar…</span>
  </div>
  <div id="sb-error"></div>
  <div id="sb-sign-label"></div>
  <div id="sb-mode-badge"></div>

  <script type="module" src="avatar3d.js"></script>
  <script>
    window.addEventListener('error', (e) => {
      document.getElementById('sb-loading').style.display = 'none';
      const err = document.getElementById('sb-error');
      err.textContent = '⚠️ ' + (e.message || 'Script error');
      err.classList.add('visible');
    });
    window.addEventListener('unhandledrejection', (e) => {
      document.getElementById('sb-loading').style.display = 'none';
      const err = document.getElementById('sb-error');
      err.textContent = '⚠️ ' + (e.reason?.message || String(e.reason));
      err.classList.add('visible');
    });
  </script>
</body>
</html>
