<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D ASL Avatar</title>
  <link rel="stylesheet" href="cwa/cwasa.css" id="cwasa-css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .shell { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .avatar-wrap { flex: 1; min-height: 0; }
    .CWASAAvatar { width: 100% !important; height: 100% !important; }
    .CWASAAvMenu { display: none !important; }
    .controls { display: none; }
    #sb-status {
      display: flex;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.5);
      font: 11px sans-serif;
      text-align: center;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="SToCA"></div>
  <div class="shell">
    <div class="avatar-wrap">
      <div class="CWASAAvatar av0" align="center"></div>
      <div class="CWASAAvMenu av0"></div>
      <div id="sb-status">Loading offline 3D avatar…</div>
    </div>
    <input type="hidden" id="glossInput" />
  </div>
  <script>
    (function () {
      const REMOTE = "https://3dasl-avatar.vercel.app";
      const LOCAL_ROOT = new URL("./", window.location.href).href;
      const VALID_AVATARS = ["anna", "marc", "francoise"];
      let SIGML_BASE = LOCAL_ROOT + "sigml/asl/";
      let SIGML_REMOTE = REMOTE + "/sigml/";
      let playingTimeout = null;
      let stopRequested = false;
      let cwasaReady = false;

      const statusEl = document.getElementById("sb-status");
      const css = document.getElementById("cwasa-css");

      window.__CWASA_ASSET_ROOT__ = LOCAL_ROOT;
      window.__CWASA_SIGML_BASE__ = SIGML_BASE;

      css.onerror = function () {
        css.onerror = null;
        css.href = REMOTE + "/cwa/cwasa.css";
      };

      function notifyReady() {
        if (cwasaReady) return;
        cwasaReady = true;
        if (statusEl) statusEl.style.display = "none";
        window.parent.postMessage({ type: "TRADUMUST_READY", avatar: "anna" }, "*");
      }

      function notifyError(msg) {
        if (statusEl) {
          statusEl.style.display = "flex";
          statusEl.textContent = msg;
        }
        window.parent.postMessage({ type: "TRADUMUST_ERROR", message: msg }, "*");
      }

      function loadScript(src, fallback) {
        const el = document.createElement("script");
        el.src = src;
        el.onload = function () { bootCwasa(); };
        el.onerror = function () {
          if (fallback) loadScript(fallback, null);
          else notifyError("CWASA failed to load — run npm run extension:cwasa");
        };
        document.body.appendChild(el);
      }

      function getAvatarMenuSelect() {
        const menu = document.querySelector(".CWASAAvMenu.av0");
        return menu ? menu.querySelector("select") : null;
      }

      function setAvatar(name) {
        const id = String(name || "").toLowerCase();
        if (!VALID_AVATARS.includes(id)) return false;
        const sel = getAvatarMenuSelect();
        if (!sel) return false;
        if (sel.value === id) return true;
        sel.value = id;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        return true;
      }

      function bootCwasa() {
        if (typeof CWASA === "undefined") {
          notifyError("CWASA runtime missing");
          return;
        }

        CWASA.init({
          jasBase: LOCAL_ROOT,
          cwaBase: LOCAL_ROOT + "cwa/",
          useClientConfig: true,
          useCwaConfig: true,
          avSettings: [{
            width: 384,
            height: 320,
            avList: "avs",
            initAv: "anna",
            allowFrameSteps: false,
            allowSiGMLText: false,
            initSiGMLURL: null,
            background: null,
          }],
        });

        if (CWASA.ready && typeof CWASA.ready.then === "function") {
          CWASA.ready.then(() => setTimeout(notifyReady, 50)).catch(() => setTimeout(notifyReady, 1200));
        } else {
          setTimeout(notifyReady, 1200);
        }

        if (typeof CWASA.addHook === "function") {
          CWASA.addHook("avatarready", () => notifyReady(), 0);
        }
      }

      loadScript(LOCAL_ROOT + "cwa/allcsa.js", REMOTE + "/cwa/allcsa.js");

      function playSiGML(sigmlURL) { CWASA.playSiGMLURL(sigmlURL); }

      function glossUrl(base, gloss) {
        return base + encodeURI(gloss) + ".sigml";
      }

      function isValidGlossAt(base, gloss) {
        let ok = false;
        const req = new XMLHttpRequest();
        req.open("HEAD", glossUrl(base, gloss), false);
        req.onload = function () { ok = req.status === 200; };
        try { req.send(); } catch (e) { ok = false; }
        return ok;
      }

      function isValidGloss(gloss) {
        if (isValidGlossAt(SIGML_BASE, gloss)) return true;
        return isValidGlossAt(SIGML_REMOTE, gloss);
      }

      function resolveGlossUrl(gloss) {
        if (isValidGlossAt(SIGML_BASE, gloss)) return glossUrl(SIGML_BASE, gloss);
        return glossUrl(SIGML_REMOTE, gloss);
      }

      function findGlosses(input) {
        const words = input.trim().split(/\s+/).filter(Boolean);
        const glosses = [];
        for (let i = 0; i < words.length; i++) {
          let matched = false;
          for (let len = Math.min(3, words.length - i); len >= 1; len--) {
            const potential = words.slice(i, i + len).join(" ");
            const upper = potential.toUpperCase().replace(/ /g, "_");
            if (isValidGloss(potential) || isValidGloss(upper)) {
              glosses.push(isValidGloss(upper) ? upper : potential);
              i += len - 1;
              matched = true;
              break;
            }
          }
          if (!matched) {
            const upper = words[i].toUpperCase().replace(/ /g, "_");
            if (isValidGloss(words[i])) glosses.push(words[i]);
            else if (isValidGloss(upper)) glosses.push(upper);
          }
        }
        return glosses;
      }

      function playGlossesSequentially(glosses, index) {
        if (index >= glosses.length || stopRequested) return;
        playSiGML(resolveGlossUrl(glosses[index]));
        playingTimeout = setTimeout(() => playGlossesSequentially(glosses, index + 1), 1650);
      }

      function playGloss() {
        stopRequested = false;
        const glosses = findGlosses(document.getElementById("glossInput").value);
        if (glosses.length) playGlossesSequentially(glosses, 0);
      }

      function resetGloss() {
        document.getElementById("glossInput").value = "";
        stopRequested = true;
        clearTimeout(playingTimeout);
      }

      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "TRADUMUST_PLAY" && data.text) {
          document.getElementById("glossInput").value = data.text;
          playGloss();
        }
        if (data.type === "TRADUMUST_PLAY_GLOSSES" && Array.isArray(data.glosses)) {
          if (data.sigmlBase) SIGML_BASE = data.sigmlBase;
          document.getElementById("glossInput").value = data.glosses.join(" ");
          playGlossesSequentially(data.glosses, 0);
        }
        if (data.type === "TRADUMUST_RESET") resetGloss();
        if (data.type === "TRADUMUST_SET_AVATAR" && data.avatar) setAvatar(data.avatar);
      });
    })();
  </script>
</body>
</html>
