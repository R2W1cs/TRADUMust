<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    SignBridge D2 — Sign-to-Text Recognizer
    Loaded as an iframe with allow="camera" by the content script.
    Sends recognized signs to parent via postMessage.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a14; color: #fff; font-family: sans-serif; }

    #video-wrap {
      position: relative;
      width: 100%;
      height: calc(100% - 48px);
      overflow: hidden;
      background: #0f0f1a;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror */
    }

    /* Landmark canvas overlay */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    #status-bar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #10101e;
      border-top: 1px solid rgba(255,255,255,0.07);
      gap: 8px;
    }

    #detected-sign {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #a78bfa;
      flex: 1;
      text-align: center;
      text-transform: uppercase;
    }

    #confidence {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }
    .dot.inactive { background: #6b7280; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #loading-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      background: #0a0a14;
      z-index: 10;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-msg">
    <div class="spinner"></div>
    <span>Starting camera…</span>
  </div>

  <div id="video-wrap">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <div id="status-bar">
    <div class="dot inactive" id="active-dot"></div>
    <div id="detected-sign">—</div>
    <div id="confidence"></div>
  </div>

  <script type="module" src="recognizer.js"></script>
</body>
</html>
