events {
  worker_connections 1024;
}

http {
  upstream web {
    server web:3000;
  }
  upstream api {
    server api:4000;
  }
  upstream ai {
    server ai:8001;
  }

  server {
    listen 80;

    location /api/auth/ { proxy_pass http://api; }
    location /api/users/ { proxy_pass http://api; }
    location /api/avatar/ { proxy_pass http://api; }
    location /api/lessons/ { proxy_pass http://api; }
    location /api/quizzes/ { proxy_pass http://api; }
    location /api/progress/ { proxy_pass http://api; }
    location /api/history/ { proxy_pass http://api; }
    location /api/admin/ { proxy_pass http://api; }
    location /api/datasets/ { proxy_pass http://api; }
    location /api/models/ { proxy_pass http://api; }
    location /api/search/ { proxy_pass http://api; }

    location /api/sign/ { proxy_pass http://ai; }
    location /api/ml/ { proxy_pass http://ai; }
    location /api/translate { proxy_pass http://ai; }
    location /api/text-to-sign { proxy_pass http://ai; }
    location /api/phrasebook { proxy_pass http://ai; }
    location /ws/ { proxy_pass http://ai; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
