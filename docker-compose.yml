services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradumust
      POSTGRES_PASSWORD: tradumust
      POSTGRES_DB: tradumust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradumust"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://tradumust:tradumust@postgres:5432/tradumust?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/ml:/app/backend/ml

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "1234:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_AI_URL: http://ai:8001
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - ai

volumes:
  postgres_data:
  redis_data:
